name: CI/CD Pipeline - Deploy to VPS

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write

jobs:
  # Job 1: Build Docker Image và Push lên GitHub Container Registry (GHCR)
  build-image:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Chuẩn hóa tên Docker Image
        id: meta
        run: |
          OWNER=$(echo "${{ github.actor }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${OWNER}/app:latest" >> $GITHUB_OUTPUT

      - name: Đăng nhập GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build và Push Docker Image lên GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.image }}

  # Job 2: Triển khai ứng dụng lên VPS từ xa qua SSH (nối sau Job build-image)
  deploy-vps:
    name: Deploy to VPS
    needs: build-image
    runs-on: ubuntu-latest
    steps:
      - name: Thực thi câu lệnh triển khai trên VPS qua SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            IMAGE="ghcr.io/$(echo "${{ github.actor }}" | tr '[:upper:]' '[:lower:]')/app:latest"
            docker pull $IMAGE
            docker stop app || true && docker rm app || true && docker run -d --name app -p 8080:8080 $IMAGE